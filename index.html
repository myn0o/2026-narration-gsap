<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Section 1 =================== -->
    <section class="hero">
      <div class="hero-title-wrap">
        <p class="hero-kicker">petites histoires, grands détours</p>
        <h1 id="hero-title">vlog.</h1>
        <p class="hero-note">Des jours ordinaires, mais pas trop au final...</p>
    </div>
    </section>

    <!-- Section 2 =================== -->
      <section id="souvenirs" class="journey">
        <div class="journey-sticky">
          <div class="image-grid" >
            <img  id="path-stage" class="travel-card card-one" src="assets/img/france.webp" alt="Un souvenir de France">
            <img id="path-stage" class="travel-card card-two" src="assets/img/espagne.jpg" alt="Un souvenir d'Espagne">
            <img id="path-stage" class="travel-card card-three" src="assets/img/college.webp" alt="Un souvenir du collège">
            <img id="path-stage" class="travel-card card-four" src="assets/img/night.jpg" alt="Un souvenir de nuit">
            <img id="path-stage" class="travel-card card-five" src="assets/img/end.webp" alt="Un paysage sous la neige">
          </div>

        </div>
      </section>

    <!-- Section 3 =================== -->

    <!-- Section 4 =================== -->
    <section id="section4" class="h100" class="light">
        <div id="movingBlock4" class="block"></div>
    </section>
    









    <!-- Scripts ====================== -->
    <!-- GSAP =========== -->
    <script src="js/GSAP/gsap.min.js"></script>
    <script src="js/GSAP/Draggable.min.js"></script>
    <script src="js/GSAP/MotionPathPlugin.min.js"></script>
    <script src="js/GSAP/ScrollToPlugin.min.js"></script>
    <script src="js/GSAP/ScrollTrigger.min.js"></script>
    <script src="js/GSAP/InertiaPlugin.min.js"></script>

    <!-- Main ====== -->
   <script src="js/main.js"></script> 

</body>
</html>
